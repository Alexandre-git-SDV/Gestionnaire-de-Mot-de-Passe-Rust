# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# CodeQL is GitHub's semantic code analysis engine for finding
# security vulnerabilities.
# More details at https://codeql.github.com/

name: "CodeQL"

on:
  push:
    branches: [ "development", "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "development", "master" ]
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

# Least privilege by default: the job below re-grants only what it needs.
permissions:
  contents: read

# A new push on a branch cancels the analysis still running for that same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read # only required for a private repository by github/codeql-action to get the Action run status

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust is analyzed without building it: the CodeQL extractor
          # reads the sources directly, so no cargo build is needed.
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Aegyx handles secrets: run the extended security queries
          # on top of the default suite.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
